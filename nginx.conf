server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nén cho nhẹ
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse-proxy API -> service "backend" trong cùng docker network.
    # globalPrefix của NestJS = 'api', nên giữ nguyên path /api/... khi forward.
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache asset build (Vite fingerprint filename -> immutable)
    location /assets/ {
        expires    30d;
        add_header  Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA fallback: mọi route khác trả về index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
